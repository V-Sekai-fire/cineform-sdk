name: cineform
on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-18.04 and macos-10.15 were retired by GitHub. A workflow naming a
        # retired image is not skipped and does not fail -- it queues for a runner that
        # will never exist, so the job sits pending forever and every pull request stays
        # UNSTABLE with no failing check to point at.
        include:
          - os: ubuntu-latest
            CC: ccache gcc
            CXX: ccache g++
          - os: ubuntu-latest
            CC: ccache clang
            CXX: ccache clang++
          - os: macos-latest
            CC: ccache clang
            CXX: ccache clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
      - name: Install dependencies (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ccache uuid-dev
          case "$CC" in
          *gcc) sudo -E apt-get -yq install gcc g++ ;;
          *clang) sudo -E apt-get -yq install clang ;;
          esac
          $CC --version
          cmake --version
          ccache --version
      - name: Install dependencies (mac)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ccache
          $CC --version
          ccache --version
      - uses: actions/checkout@v4
      - name: Cache ccache files
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ matrix.CC }}-${{ hashFiles('**/*.c') }}-${{ hashFiles('**/*.cpp') }}
      - name: Run CMake
        run: |
          [ -d "$HOME/.ccache" ] && sudo chown -R "$USER": "$HOME/.ccache"
          cmake -S . -B build
      - name: Run make
        run: |
          sudo make -j "$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)" -C build
